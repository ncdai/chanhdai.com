services:
  portfolio:
    image: adrien-portfolio:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?required}
        NEXT_PUBLIC_REGISTRY_NAMESPACE: ${NEXT_PUBLIC_REGISTRY_NAMESPACE:-}
        NEXT_PUBLIC_REGISTRY_NAMESPACE_URL: ${NEXT_PUBLIC_REGISTRY_NAMESPACE_URL:-}
        NEXT_PUBLIC_DMCA_URL: ${NEXT_PUBLIC_DMCA_URL:-}
        NEXT_PUBLIC_OPENPANEL_CLIENT_ID: ${NEXT_PUBLIC_OPENPANEL_CLIENT_ID:-}
        NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
        NEXT_PUBLIC_ADSENSE_CLIENT: ${NEXT_PUBLIC_ADSENSE_CLIENT:-}
    env_file:
      - .env.production
    restart: unless-stopped
    init: true
    ports:
      # Local/preview fallback only. Openship should route to port 3000 on its
      # private network without publishing this port directly.
      - "127.0.0.1:${PORTFOLIO_PREVIEW_PORT:-3100}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

